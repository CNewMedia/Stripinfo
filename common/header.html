  </div>
</div>

<script>
(function() {
  function initCollapsibleCategories() {
    if (!document.body.classList.contains("navigation-categories")) return;
    var container = document.querySelector(".category-boxes, .category-boxes-with-topics");
    if (!container || container.dataset.siCollapsible === "true") return;
    container.dataset.siCollapsible = "true";

    var allBoxes = container.querySelectorAll(".category-box");
    var maxVisible = 6;

    allBoxes.forEach(function(box, index) {
      if (index >= maxVisible) {
        box.classList.add("si-hidden-category");
        box.style.display = "none";
      }
    });

    if (allBoxes.length <= maxVisible) return;

    var toggleBtn = document.createElement("button");
    toggleBtn.className = "si-toggle-categories";
    toggleBtn.innerHTML = "Meer tonen +";
    toggleBtn.dataset.expanded = "false";

    toggleBtn.addEventListener("click", function() {
      var isExpanded = toggleBtn.dataset.expanded === "true";
      container.classList.toggle("show-all", !isExpanded);
      allBoxes.forEach(function(box, index) {
        if (index >= maxVisible) {
          box.style.display = isExpanded ? "none" : "";
        }
      });
      if (isExpanded) {
        toggleBtn.innerHTML = "Meer tonen +";
        toggleBtn.dataset.expanded = "false";
      } else {
        toggleBtn.innerHTML = "Minder tonen −";
        toggleBtn.dataset.expanded = "true";
      }
    });

    container.parentNode.insertBefore(toggleBtn, container.nextSibling);
  }

  function run() {
    setTimeout(initCollapsibleCategories, 500);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", run);
  } else {
    run();
  }

  var outlet = document.querySelector("#main-outlet");
  if (outlet) {
    var mo = new MutationObserver(function() { run(); });
    mo.observe(outlet, { childList: true, subtree: true });
  }
})();

// Hero banner voor categories list page
(function() {
  function addCategoriesHero() {
    if (!document.body.classList.contains("categories-list")) return;
    var hero = document.querySelector(".stripinfo-categories-hero");
    if (hero) return; // Al toegevoegd
    
    var mainOutlet = document.querySelector("#main-outlet");
    if (!mainOutlet) return;
    
    var heroDiv = document.createElement("div");
    heroDiv.className = "stripinfo-categories-hero";
    heroDiv.innerHTML = 
      '<div class="hero-content">' +
        '<h1 class="hero-title">WELKOM OP HET STRIPINFO FORUM</h1>' +
        '<p class="hero-subtitle">Ontdek alle categorieën en start je eigen discussie</p>' +
        '<a href="/new-topic" class="hero-cta-btn">Nieuw Topic Starten</a>' +
      '</div>';
    
    var categoryList = mainOutlet.querySelector(".category-list, .categories-list");
    if (categoryList && categoryList.parentNode) {
      categoryList.parentNode.insertBefore(heroDiv, categoryList);
    } else {
      mainOutlet.insertBefore(heroDiv, mainOutlet.firstChild);
    }
  }
  
  function runHero() {
    setTimeout(addCategoriesHero, 300);
  }
  
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", runHero);
  } else {
    runHero();
  }
  
  var outlet = document.querySelector("#main-outlet");
  if (outlet) {
    var mo = new MutationObserver(function() { addCategoriesHero(); });
    mo.observe(outlet, { childList: true, subtree: true });
  }
})();
</script>
